<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Fichas del partido</title>
<style>
  :root {
    --fondo: #f6f7f9; --panel: #ffffff; --borde: #d9dee7; --texto: #111827; --suave: #5b6474;
    --acento: #15803d; --dorsal: #1d4ed8; --aviso: #b45309;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #0b1220; --panel: #111a2e; --borde: #26355a; --texto: #e6edf8; --suave: #9fb0c9; --acento: #4ade80; --dorsal: #3b82f6; --aviso: #fbbf24; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--borde);
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  h1 { margin: 0; font-size: 19px; text-wrap: balance; }
  .sub { color: var(--suave); font-size: 13px; margin-top: 2px; }
  main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); max-width: 1100px; margin: 0 auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); margin: 18px 0 8px; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .ficha { padding: 0; border: 1px solid var(--borde); border-radius: 12px; overflow: hidden; background: var(--panel); text-align: left; cursor: zoom-in; color: inherit; font: inherit; }
  .ficha img, .ficha .sin { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #000; display: block; }
  .ficha .sin { background: var(--borde); }
  .ficha span { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
  .dorsal { min-width: 30px; padding: 1px 6px; border-radius: 6px; background: var(--dorsal); color: #fff; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .cargo { font-style: normal; font-size: 12px; margin-left: auto; padding: 1px 8px; border-radius: 999px; background: var(--fondo); border: 1px solid var(--borde); color: var(--suave); }
  .estado { text-align: center; padding: 48px 16px; color: var(--suave); }
  .estado strong { display: block; color: var(--texto); font-size: 18px; margin-bottom: 6px; }
  #grande { position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; }
  #grande img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  #grande div { color: #fff; text-align: center; padding: 12px 16px max(16px, env(safe-area-inset-bottom, 0px)); font-size: 18px; font-weight: 600; }
  #grande button { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: 12px; background: rgba(255, 255, 255, .15); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; }
</style>
</head>
<body>
<header>
  <h1 id="titulo">Fichas del partido</h1>
  <div class="sub" id="sub">Cargando…</div>
</header>
<main id="contenido"></main>
<div id="grande" hidden><button id="cerrar">Cerrar</button><img id="grandeImg" alt=""><div id="grandeTxt"></div></div>
<script type="module" src="/src/arbitro.js"></script>
</body>
</html>
